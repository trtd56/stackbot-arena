<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STACKBOT ARENA</title>
  <style>
    :root { --fg: #e8eef2; --dim: #9fb3c8; --accent: #7ff6ff; --bg: #0a0c12; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Hiragino Sans", monospace; }
    canvas { display: block; image-rendering: pixelated; }
    body.playing canvas { cursor: none; }
    .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(10,12,18,0.35), rgba(10,12,18,0.85)); }
    .overlay[hidden] { display: none; }
    .panel { text-align: center; padding: 28px 32px; max-width: 560px; margin: 0 16px;
      background: rgba(14,17,26,0.82); border: 1px solid #2b3349; border-radius: 10px; }
    h1 { margin: 0 0 4px; font-size: clamp(30px, 7vw, 54px); letter-spacing: 0.08em; color: #fff;
      text-shadow: 0 0 18px rgba(127,246,255,0.45); }
    .tag { color: var(--accent); margin: 0 0 18px; font-size: 13px; letter-spacing: 0.2em; }
    p { color: var(--dim); line-height: 1.7; font-size: 14px; margin: 0 0 14px; }
    table { margin: 0 auto 18px; border-collapse: collapse; font-size: 13px; text-align: left; }
    td { padding: 3px 10px; color: var(--dim); }
    td:first-child { color: var(--fg); text-align: right; white-space: nowrap; }
    button { font: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #0a0c12;
      background: var(--accent); border: 0; border-radius: 6px; padding: 12px 34px; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    .big { font-size: 56px; font-weight: 800; color: #fff; margin: 4px 0 0; }
    .stats { display: flex; gap: 28px; justify-content: center; margin: 10px 0 20px; color: var(--dim); font-size: 13px; }
    .stats b { display: block; color: var(--fg); font-size: 22px; }
    .hint { font-size: 12px; margin-top: 12px; color: #6b7a90; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="overlay" id="title">
    <div class="panel">
      <h1>STACKBOT ARENA</h1>
      <div class="tag">SPRITE-STACKED ROBOT BATTLE</div>
      <p>戦闘ロボ VANGUARD を操作し、次々と現れる敵ロボットを撃ち倒せ。<br>ウェーブを重ねるほど敵は増え、強くなる。</p>
      <table>
        <tr><td>WASD / 矢印</td><td>移動</td></tr>
        <tr><td>マウス</td><td>照準</td></tr>
        <tr><td>左クリック（長押し）</td><td>射撃</td></tr>
        <tr><td>SPACE</td><td>ダッシュ（短い無敵）</td></tr>
        <tr><td>Q / E</td><td>視点を回す</td></tr>
        <tr><td>M</td><td>消音</td></tr>
      </table>
      <button id="start">START</button>
      <div class="hint">Enter でも開始</div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="panel">
      <div class="tag">VANGUARD DESTROYED</div>
      <div>倒した数</div>
      <div class="big" id="over-kills">0</div>
      <div class="stats">
        <div>到達ウェーブ<b id="over-wave">1</b></div>
        <div>ベスト<b id="over-best">0</b></div>
      </div>
      <button id="retry">RETRY</button>
      <div class="hint">R / Enter でもリトライ</div>
    </div>
  </div>

  <script src="src/models.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
