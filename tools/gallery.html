<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Gallery</title>
  <style>
    html, body { margin: 0; background: #353029; color: #9fb3c8; font: 13px ui-monospace, Menlo, monospace; }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <!-- モデルの見た目確認用。別の版の models.js と比べたいときは ?src=パス で差し替える -->
  <canvas id="c"></canvas>
  <script>
    const src = new URLSearchParams(location.search).get('src') || '../src/models.js';
    const s = document.createElement('script');
    s.src = src;
    s.onload = draw;
    document.body.appendChild(s);
    function draw() {
      const SC = 3, Z = 2;
      const names = ['vanguard', 'scuttler', 'warden', 'colossus'];
      const angles = [-Math.PI / 2, -Math.PI / 4, 0, Math.PI * 0.75];
      const cw = 190, ch = 260;
      const cv = document.getElementById('c'), ctx = cv.getContext('2d');
      cv.width = cw * angles.length + 40; cv.height = ch * names.length + 20;
      ctx.fillStyle = '#353029'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.imageSmoothingEnabled = false;
      names.forEach((n, row) => {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#9fb3c8'; ctx.fillText(n.toUpperCase(), 10, row * ch + 20);
        angles.forEach((a, col) => {
          const res = Models.RES || 1, m = Models.get(n, 1, false, false, 0, Models.lightOf ? Models.lightOf(a) : 0), h = (m.size * res) / 2, sx = 40 + col * cw + cw / 2, sy = row * ch + ch * 0.72;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = 'rgba(20,14,34,0.45)';
          ctx.beginPath(); ctx.ellipse(sx + 8, sy + 8, m.size / 2 * SC * Z * 0.8, m.size / 2 * SC * Z * 0.6, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
          const c = Math.cos(a) * SC * Z / res, s = Math.sin(a) * SC * Z / res;
          m.slices.forEach((img, i) => {
            if (!img) return;
            for (let k = 0; k < SC * Z; k++) {
              ctx.setTransform(c, s, -s, c, sx, sy - (i * SC * Z + k));
              ctx.drawImage(img, -h, -h);
            }
          });
        });
      });
      document.title = 'ready';
    }
  </script>
</body>
</html>
